// app/build.gradle
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ultrafast.transfer'
    compileSdk 34

    defaultConfig {
        applicationId "com.ultrafast.transfer"
        minSdk 26
        targetSdk 34

        versionCode 1
        versionName "1.0"

        multiDexEnabled true
    }
    buildFeatures {
        viewBinding true  // Enable this
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {

    // Core Android
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.databinding:viewbinding:8.1.0'

    // Lifecycle (for clean architecture)
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'

    // RecyclerView (device list, file list)
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Optional (recommended for threading cleanup later)
    implementation 'androidx.lifecycle:lifecycle-runtime:2.7.0'

    // Image loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
}